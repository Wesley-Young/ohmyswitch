# Manual runs build artifacts only. Version tags also publish the CLI and create a GitHub Release.
name: Build and release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: build-app-${{ github.ref }}
  # Never interrupt a release after publishing has started.
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The pnpm version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # pnpm/action-setup caches the store.
          package-manager-cache: false
      - name: Read the version
        id: version
        run: |
          node <<'NODE'
          const { appendFileSync } = require('node:fs');
          const { version } = require('./package.json');
          const semver = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*))*))?$/;
          const match = semver.exec(version);
          if (!match) throw new Error(`Invalid release version: ${version}`);
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\nprerelease=${Boolean(match[4])}\n`);
          NODE
      - name: Check the release tag
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$RELEASE_TAG" != "v$RELEASE_VERSION" ]; then
            echo "Tag $RELEASE_TAG does not match package version $RELEASE_VERSION" >&2
            exit 1
          fi
          # Match the local publishing rule: releases must come from main.
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          # An Apple Silicon runner; the targets in electron-builder.yml decide the architectures.
          - os: macos-latest
            platform: mac
            installer: dist/*.dmg
          - os: windows-latest
            platform: win
            installer: dist/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # The pnpm version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # pnpm/action-setup caches the store.
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec electron-vite build
      # Release upload is handled after all builds and the npm publish succeed.
      - run: pnpm exec electron-builder --${{ matrix.platform }} --publish never
      - name: Check the ad-hoc signature
        if: matrix.platform == 'mac'
        run: |
          app=dist/mac-arm64/ohmyswitch.app
          codesign --verify --deep --strict "$app"
          codesign -dv "$app" 2>&1 | grep -q 'Signature=adhoc'
      - uses: actions/upload-artifact@v7
        with:
          name: ohmyswitch-${{ needs.verify.outputs.version }}-${{ matrix.platform }}
          path: ${{ matrix.installer }}
          if-no-files-found: error
          # The installers are already compressed.
          compression-level: 0

  publish-cli:
    if: github.event_name == 'push'
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      npm_config_registry: https://registry.npmjs.org/
    steps:
      - uses: actions/checkout@v7
      # Do not restore dependency caches in the publishing job.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Check npm supports trusted publishing
        run: |
          npm_version="$(npm --version)"
          echo "npm $npm_version"
          node -e 'const [major, minor, patch] = process.argv[1].split(".").map(Number); if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) throw new Error("Trusted publishing requires npm >=11.5.1");' "$npm_version"
      - run: pnpm install --frozen-lockfile
      - name: Publish stable CLI
        if: needs.verify.outputs.prerelease == 'false'
        run: pnpm publish:cli
      - name: Publish prerelease CLI
        if: needs.verify.outputs.prerelease == 'true'
        run: pnpm publish:cli --tag next

  release:
    if: github.event_name == 'push'
    needs: [verify, build, publish-cli]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: ohmyswitch-${{ needs.verify.outputs.version }}-*
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.dmg
            release/*.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ needs.verify.outputs.prerelease }}
          # A rerun after a partial upload should be able to replace an existing asset.
          overwrite_files: true
