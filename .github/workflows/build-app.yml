# Builds the desktop app and uploads the installers as workflow artifacts; nothing is released or published.
# Run it from the Actions tab. macOS is arm64 only, ad-hoc signed and not notarized; Windows is x64 only and
# unsigned. The CLI is published to npm separately, with `pnpm publish:cli`.
name: Build app

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The pnpm version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # pnpm/action-setup caches the store.
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          # An Apple Silicon runner; the targets in electron-builder.yml decide the architectures.
          - os: macos-latest
            platform: mac
            installer: dist/*.dmg
          - os: windows-latest
            platform: win
            installer: dist/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # The pnpm version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # pnpm/action-setup caches the store.
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec electron-vite build
      # electron-builder would publish to GitHub Releases on its own when it detects CI; this workflow never does.
      - run: pnpm exec electron-builder --${{ matrix.platform }} --publish never
      - name: Check the ad-hoc signature
        if: matrix.platform == 'mac'
        run: |
          app=dist/mac-arm64/ohmyswitch.app
          codesign --verify --deep --strict "$app"
          codesign -dv "$app" 2>&1 | grep -q 'Signature=adhoc'
      - name: Read the version
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: ohmyswitch-${{ steps.version.outputs.version }}-${{ matrix.platform }}
          path: ${{ matrix.installer }}
          if-no-files-found: error
          # The installers are already compressed.
          compression-level: 0
