appId: io.github.wesley-young.ohmyswitch
productName: ohmyswitch
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
mac:
  icon: build/icon.icns
  # Only English and Simplified/Traditional Chinese; the other ~50 Chromium locales are dropped.
  electronLanguages: [en, zh_CN]
  category: public.app-category.developer-tools
  target: [dmg, zip]
win:
  icon: build/icon.ico
  target: [nsis]
linux:
  icon: build/icon.png
  category: Development
  target: [AppImage]
# ohmyswitch:// import links, see docs/deep-link.md. Windows registers at runtime via setAsDefaultProtocolClient.
protocols:
  - name: ohmyswitch
    schemes: [ohmyswitch]
